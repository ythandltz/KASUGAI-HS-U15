<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEWS 追加（関係者用）</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main class="container" style="padding:24px 0 60px;">
    <div class="card">
      <h2>NEWS追加（関係者用）</h2>
      <p style="color:var(--muted);margin:8px 0 16px;">
        送信すると <code>assets/news.json</code> に追記され、Netlifyが自動更新します（反映まで少し時間がかかります）。
      </p>

      <!-- ★ action をあなたの /exec に置き換え -->
      <form method="POST"
      action="https://script.google.com/macros/s/AKfycbx97B4XT3zK9yJy11FIMwKnsqfJaiFL6IcXukaHv4bFun1hazwZVExsbmdmVESlVlvd7Q/exec"
      target="_blank">
  <label>日付（YYYY/MM/DD）</label><br />
  <input name="date" id="date"
         style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;" /><br /><br />

  <label>タイトル</label><br />
  <input name="title"
         style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;" /><br /><br />

  <label>本文</label><br />
  <textarea name="body" rows="7"
            style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;"></textarea><br /><br />

  <button class="btn primary" type="submit" style="cursor:pointer; pointer-events:auto;">
    追加する
  </button>
</form>

      <p style="margin-top:12px;color:var(--muted);">
        送信結果は下に表示されます：
      </p>
      <iframe name="postResult" style="width:100%;height:120px;border:1px solid var(--line);border-radius:12px;background:#fff;"></iframe>
    </div>
  </main>

  <script>
    const pad = (n)=> String(n).padStart(2,"0");
    const d = new Date();
    document.getElementById("date").value = `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  </script>
</body>
</html>
