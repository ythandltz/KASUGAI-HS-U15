<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>動向｜春日井ハンドボールスクール U-15</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
    <header class="header">
      <div class="container header-inner">
          <div class="brand" aria-label="春日井ハンドボールスクール U-15">
          <img src="assets/logo.png" alt="ロゴ" />
          <div class="brand-title">
              <span>春日井ハンドボールスクール U-15</span>
            <strong>KASUGAI HANDBALL SCHOOL U-15</strong>
          </div>
      </div>
        <nav class="nav">
          <a data-nav href="index.html">TOP</a>
          <a data-nav href="policy.html">チーム方針・概要</a>
          <a data-nav href="news.html">活動情報</a>
          <a data-nav href="staff.html">スタッフ</a>
          <a data-nav href="recruit.html">募集要項</a>
          <a data-nav href="contact.html">お問い合わせ</a>
        </nav>
      </div>
    </header>

  <main class="container">
    <section class="hero">
      <h1>現在の動向</h1>
      <p>大会結果、練習試合、活動レポートなどを掲載します。</p>
    </section>

    <section class="grid">
      <div class="card cols-12">
        <h2>お知らせ一覧</h2>
        <ul class="list" id="newsAll"></ul>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container">© <span id="y"></span> 春日井ハンドボールスクール U-15</div></footer>

  <script type="module" src="assets/main.js"></script>
  <script type="module">
  async function loadNews(){
    const res = await fetch("assets/news.json"); // ← ここ重要（assets/）
    if(!res.ok) throw new Error("news.json fetch failed: " + res.status);

    const items = await res.json();
    items.sort((a,b)=> String(b.date).localeCompare(String(a.date)));

    const ul = document.getElementById("newsAll");
    if(!ul) throw new Error("#newsAll が見つかりません（id違いの可能性）");

    ul.innerHTML = "";
    for(const n of items){
      const li = document.createElement("li");
      li.className = "item";
      li.innerHTML = `
        <div class="meta">${n.date ?? ""}</div>
        <div class="title">${n.title ?? ""}</div>
        <div class="body">${(n.body ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}</div>
      `;
      ul.appendChild(li);
    }
  }

  loadNews().catch(err=>{
    console.error(err);
    const ul = document.getElementById("newsAll");
    if(ul){
      ul.innerHTML = `<li class="item"><div class="title">読み込みに失敗しました</div><div class="body">${err.message}</div></li>`;
    }
  });
</script>
</body>
</html>
