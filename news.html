<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>動向｜春日井ハンドボールスクール U-15</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.svg" alt="ロゴ" />
        <div class="brand-title">
          <strong>春日井ハンドボールスクール U-15</strong>
          <span>KASUGAI HANDBALL SCHOOL U-15</span>
        </div>
      </a>
      <nav class="nav">
        <a data-nav href="policy.html">方針</a>
        <a data-nav href="news.html">動向</a>
        <a data-nav href="staff.html">スタッフ</a>
        <a data-nav href="recruit.html">選手募集</a>
        <a data-nav href="contact.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>現在の動向</h1>
      <p>大会結果、練習試合、活動レポートなどを掲載します。</p>
    </section>

    <section class="grid">
      <div class="card cols-12">
        <h2>お知らせ一覧</h2>
        <ul class="list" id="newsList"></ul>
        <p style="margin-top:12px;color:var(--muted);font-size:12px;">
          更新方法：<code>assets/news.json</code> を編集して追加してください。
        </p>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container">© <span id="y"></span> 春日井ハンドボールスクール U-15</div></footer>

  <script type="module">
    import "./assets/main.js";
    document.getElementById("y").textContent = new Date().getFullYear();

    const res = await fetch("assets/news.json");
    const items = await res.json();

    const list = document.getElementById("newsList");
    items.forEach(n=>{
      const li = document.createElement("li");
      li.className = "item";
      li.innerHTML = `
        <div class="meta">${n.date}</div>
        <div class="title">${n.title}</div>
        <div class="body">${n.body ?? ""}</div>
      `;
      list.appendChild(li);
    });
  </script>
</body>
</html>
